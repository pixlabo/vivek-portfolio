name: Sync videos from Drive

# Runs as soon as the Drive watcher (tools/drive-watch.gs) reports a change in the
# Drive folder, on the "Run workflow" button, when the sync tooling itself changes,
# and once an hour as a fallback. It compresses new videos, removes deleted ones and
# commits the result, which makes Vercel redeploy the site.
on:
  repository_dispatch:
    types: [drive-changed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/sync-videos.yml"
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and gdown
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q gdown==6.4.2

      - name: Sync videos
        run: python tools/sync_videos.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "pixlabo"
          git config user.email "info@pixlabo.com"
          git add -A videos
          if git diff --cached --quiet; then
            echo "No changes in Drive."
            exit 0
          fi
          git commit -m "Sync videos from Drive"
          git push
